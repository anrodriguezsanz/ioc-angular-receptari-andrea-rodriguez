<div 
  class="card" 
  tabindex="0" 
  role="button" 
  aria-label="Seleccionar recepta: {{ recepta.titol }}"
  (click)="seleccionarTargeta()" 
  (keyup.enter)="seleccionarTargeta()"
  (keyup.space)="seleccionarTargeta()">
  
  <div class="icona-cor" [class.actiu]="recepta.destacada">
    @if (recepta.destacada) {
      ♥
    } @else {
      ♡
    }
  </div>

  <h3>{{ recepta.titol }}</h3>
  <p>{{ recepta.descripcio }}</p>
  <app-etiqueta-categoria [categoria]="recepta.categoria"></app-etiqueta-categoria>
</div>
